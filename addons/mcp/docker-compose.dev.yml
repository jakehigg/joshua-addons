# Build the image from this checkout instead of running a release. Use it
# when you change the code:
#
#   docker compose -f addons/mcp/docker-compose.yml -f addons/mcp/docker-compose.dev.yml up -d --build
#
# or, with the root Makefile:
#
#   make up-dev ADDON=mcp
#
# The build is tagged `joshua-addons-mcp:dev`, so it never replaces a
# release on your machine. The build context is the repo root, because the
# addon depends on the workspace lockfile.
services:
  mcp:
    image: joshua-addons-mcp:dev
    build:
      context: ../..
      dockerfile: addons/mcp/Dockerfile
