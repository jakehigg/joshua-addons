# Build the image from this checkout instead of running a release. Use it
# when you change the code:
#
#   docker compose -f addons/chores/docker-compose.yml -f addons/chores/docker-compose.dev.yml up -d --build
#
# or, with the root Makefile:
#
#   make up-dev ADDON=chores
#
# The build is tagged `joshua-addons-chores:dev`, so it never replaces a
# release on your machine. `make up ADDON=chores` still runs the release, and
# `make up-dev ADDON=chores` still runs your build. Nothing here changes
# docker-compose.yml. The build context is the repo root, because the addon
# depends on the workspace lockfile.
services:
  chores:
    image: joshua-addons-chores:dev
    build:
      context: ../..
      dockerfile: addons/chores/Dockerfile
