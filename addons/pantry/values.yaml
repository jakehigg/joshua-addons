# The pantry addon, installed with charts/joshua-addon. SQLite needs
# somewhere to keep its file, so persistence is on by default, at the
# chart's default mountPath (/data — this addon's default PANTRY_DB path).
# Point DATABASE_URL at Postgres instead (env, or an existingSecret) to drop
# this volume.
image:
  repository: ghcr.io/jakehigg/joshua-addons-pantry

persistence:
  enabled: true
