<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Records</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23222'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23555' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c8553d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Records</h1>
    <p id="count" class="count" aria-live="polite">Loading</p>
  </div>
  <div class="tools">
    <input id="search" type="search" placeholder="Artist, title, label" autocomplete="off" aria-label="Search the collection">
    <select id="sort" aria-label="Sort order">
      <option value="shelf">Shelf order</option>
      <option value="facet">Genre runs</option>
      <option value="year">Release year</option>
      <option value="added">Recently added</option>
    </select>
  </div>
</header>

<nav class="filters" aria-label="Filters">
  <div id="facets" class="chips" role="group" aria-label="Genre"></div>
  <div id="styles" class="chips chips-styles" role="group" aria-label="Style" hidden></div>
  <div id="active" class="active" hidden>
    <span id="active-text"></span>
    <button id="clear" type="button" class="link">Clear</button>
  </div>
</nav>

<main>
  <section id="carousel" class="carousel" aria-label="Covers" tabindex="0"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<dialog id="detail" class="detail" aria-labelledby="detail-title">
  <button id="detail-close" type="button" class="close" aria-label="Close">&times;</button>
  <div id="detail-body" class="detail-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
