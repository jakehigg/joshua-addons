# Build the image from this checkout instead of running a release. Use it
# when you change the code:
#
#   docker compose -f addons/vinyl/docker-compose.yml -f addons/vinyl/docker-compose.dev.yml up -d --build
#
# or, with the root Makefile:
#
#   make up-dev ADDON=vinyl
#
# The build is tagged `joshua-addons-vinyl:dev`, so it never replaces a
# release on your machine. `make up ADDON=vinyl` still runs the release, and
# `make up-dev ADDON=vinyl` still runs your build. Nothing here changes
# docker-compose.yml. The build context is the repo root, because the addon
# depends on the workspace lockfile.
services:
  vinyl:
    image: joshua-addons-vinyl:dev
    build:
      context: ../..
      dockerfile: addons/vinyl/Dockerfile
