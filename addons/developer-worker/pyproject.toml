[project]
name = "joshua-developer-worker"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    # The same minor as joshua-ai core.
    "claude-agent-sdk>=0.2.144,<0.3",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["starlette>=0.37"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joshua_developer_worker"]

# pytest reads only the nearest config file, so this block repeats the root
# settings and adds the coverage floor for this addon.
[tool.pytest.ini_options]
markers = ["integration: needs services or network"]
addopts = "-m 'not integration' --cov=joshua_developer_worker --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
