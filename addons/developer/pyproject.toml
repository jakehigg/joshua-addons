[project]
name = "joshua-developer"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.9",
    "pyyaml>=6",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pytest reads only the nearest config file, so this block repeats the root
# settings and adds the coverage floor for this addon.
[tool.pytest.ini_options]
markers = ["integration: needs services or network"]
addopts = "-m 'not integration' --cov=joshua_developer --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
