# The developer addon, installed with charts/joshua-addon. The manager starts
# one Kubernetes Job for each task, in its own namespace. developer.db needs
# somewhere to live, so persistence is on, at /data. developer.yaml comes from
# configFile. Put the tokens in an existingSecret, never here.
image:
  repository: ghcr.io/jakehigg/joshua-addons-developer

persistence:
  enabled: true
  mountPath: /data
  size: 1Gi

# existingSecret: joshua-developer
# The keys of the Secret:
#   DEVELOPER_TOKENS          one bearer token for each person: alex=<token>,mia=<token>
#   ADDON_TOKEN               a bearer token with no person, for reads
#   CLAUDE_CODE_OAUTH_TOKEN   the Claude token of the Claude forwarder
#   JOSHUA_TOKEN_DEVELOPER    the fleet token for channels
#   the git tokens            the names that token_env gives in developer.yaml:
#                             one for each platform (such as GITHUB_TOKEN or
#                             GITLAB_TOKEN), and one for each
#                             people.<id>.platforms entry (such as GITHUB_TOKEN_ALEX)

configFile:
  enabled: true
  name: developer.yaml
  mountPath: /etc/joshua-addon/developer.yaml
  content: |
    network: off
    default_persona: opus
    max_workers: 2
    # The total time a worker waits for answers in one task, in seconds. The
    # task clock pauses while it waits. A persona can set its own value.
    ask_wait_s: 7200
    # The limits of one worker. disk is the sizeLimit of each emptyDir and
    # the ephemeral-storage limit of the worker pod.
    # manager_grace is the seconds a worker waits for a manager that
    # restarts, such as on a deploy.
    # env adds environment variables for your own worker image. The addon
    # keeps its own variables: TASK_ID, MANAGER_URL, GIT_PROXY_URL,
    # TASK_TOKEN, MANAGER_GRACE_S, HOME, CLAUDE_CONFIG_DIR, HTTP_PROXY,
    # HTTPS_PROXY, and NO_PROXY. See "Using your own worker image" in the
    # README of the addon.
    worker:
      memory: 2g
      cpus: 2.0
      disk: 4Gi
      manager_grace: 600
      env: {}
    # The days a task that did not end success keeps its work directory,
    # with worker.workClaim set. The sweeper then deletes it.
    work:
      keep_failed: 7
    # The limits ceilings of a run (run_project), in percent used. A run
    # pauses before a task when a window is at or over its ceiling.
    runs:
      ceiling_five_hour_pct: 80
      ceiling_seven_day_pct: 90
    # The package proxy of the manager, on port 8003. With enabled: true, a
    # worker gets HTTPS_PROXY, HTTP_PROXY, and NO_PROXY, and reaches these
    # hosts only, so it can install dependencies and run the tests. The
    # proxy carries no credential and allows no git host.
    packages:
      enabled: false
      hosts:
        - registry.npmjs.org
        - pypi.org
        - files.pythonhosted.org
    platforms:
      github.com:
        kind: github
        token_env: GITHUB_TOKEN
    repos: []
    people: {}

env:
  DEVELOPER_DATA_DIR: /data
  DEVELOPER_CONFIG: /etc/joshua-addon/developer.yaml
  WORKER_RUNTIME: kubernetes
  # The worker image. Use the same version as this chart. For your own
  # worker image, set worker.image below: it wins over this value.
  WORKER_IMAGE: ghcr.io/jakehigg/joshua-addons-developer-worker:0.2.0
  # The name a worker uses to reach the manager: the Service name, which is
  # the release name. Set it to the name of your release.
  MANAGER_HOST: developer
  # Where a task report goes. Set the address of the joshua-ai channels
  # Service, and put JOSHUA_TOKEN_DEVELOPER in the existingSecret.
  # CHANNELS_URL: http://<joshua-ai channels service>:8000
  # run_project: the tasks addon (its release name is the Service name) and
  # joshua-ai core. Neither needs a bearer inside the namespace.
  TASKS_URL: http://tasks:8000
  CORE_URL: http://joshua-core:8000
  # A CA bundle for a git host with a private certificate authority. Mount
  # the file, and give its path. The manager also gives it to each worker.
  # GIT_CA_BUNDLE: /etc/ssl/certs/git-host-ca.pem
  # The seconds a worker has from its start to its first brief call (the
  # image pull). A worker that takes longer fails its task.
  # WORKER_START_GRACE_S: "600"

# The worker pods.
#
# image is your own worker image. It wins over env.WORKER_IMAGE above. Keep
# the contract in "Using your own worker image" in the README of the addon.
# imagePullSecret is an image pull Secret in this namespace, for a private
# registry. imagePullPolicy is Always, IfNotPresent, or Never; empty means
# IfNotPresent.
#
# workClaim is the work storage of the workers. Empty keeps a scratch
# emptyDir at /work in each worker, so a restart or a failed push loses the
# commits of a task. Set it to an existing ReadWriteMany claim, and each task
# gets its own directory on it, which is deleted only when the task ends
# success. The chart does not make the claim.
worker:
  image: ""
  imagePullSecret: ""
  imagePullPolicy: ""
  workClaim: ""

# The namespace of the worker Jobs: the namespace of the manager pod.
extraEnv:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

# The worker API (8001), the git host tunnel (8002), and the package proxy
# (8003), for the workers. The package proxy listens only when the packages
# block in developer.yaml is on.
service:
  extraPorts:
    - name: worker-api
      port: 8001
      targetPort: 8001
    - name: git-proxy
      port: 8002
      targetPort: 8002
    - name: package-proxy
      port: 8003
      targetPort: 8003

# A Role that lets the manager start and delete worker Jobs, and read their
# pods and logs, in this namespace only.
rbac:
  enabled: true

# A worker can connect to the manager on 8001, 8002, and 8003, and to the
# cluster DNS pods (networkPolicy.dns in the chart values). For
# `network: on` in developer.yaml, set workersInternetEgress to true, and set
# clusterCidrs to the pod and Service CIDRs of your cluster. The CNI must
# enforce NetworkPolicy.
networkPolicy:
  enabled: true
  workersInternetEgress: false
  clusterCidrs: []
  # The namespaces of the joshua-ai gateway. Empty means every namespace.
  gatewayNamespaces: []

# The manager is small. The workers carry the load, with the `worker` limits
# in developer.yaml.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000
