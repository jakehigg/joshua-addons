# The developer addon, installed with charts/joshua-addon. developer.db needs
# somewhere to live, so persistence is on, at /data. developer.yaml comes from
# configFile. Put DEVELOPER_TOKENS, ADDON_TOKEN, JOSHUA_TOKEN_DEVELOPER, and
# the git tokens that developer.yaml names in an existingSecret, never here.
image:
  repository: ghcr.io/jakehigg/joshua-addons-developer

persistence:
  enabled: true
  mountPath: /data
  size: 1Gi

# existingSecret: joshua-developer # keys: DEVELOPER_TOKENS, ADDON_TOKEN, JOSHUA_TOKEN_DEVELOPER, CLAUDE_CODE_OAUTH_TOKEN, GITHUB_TOKEN
# The git token keys are the names that token_env gives in developer.yaml:
# one for each platform (such as GITHUB_TOKEN or GITLAB_TOKEN), and one for
# each people.<id>.platforms entry (such as GITHUB_TOKEN_ALEX).

configFile:
  enabled: true
  name: developer.yaml
  mountPath: /etc/joshua-addon/developer.yaml
  content: |
    network: off
    default_persona: opus
    max_workers: 2
    platforms:
      github.com:
        kind: github
        token_env: GITHUB_TOKEN
    repos: []
    people: {}

env:
  DEVELOPER_DATA_DIR: /data
  DEVELOPER_CONFIG: /etc/joshua-addon/developer.yaml
  # The Kubernetes runtime comes in a later release. Until then, stub.
  WORKER_RUNTIME: stub
  # The worker image. The default release tag matches this chart.
  # WORKER_IMAGE: ghcr.io/jakehigg/joshua-addons-developer-worker:<version>
  # The name a worker uses to reach the manager: the Service name of this
  # release, for the worker API (8001) and the git host tunnel (8002).
  # MANAGER_HOST: joshua-developer
  # Where a task report goes. Set the channels Service address, and put
  # JOSHUA_TOKEN_DEVELOPER in the existingSecret.
  # CHANNELS_URL: http://joshua-channels.<namespace>.svc.cluster.local:8000
  # A CA bundle for a git host with a private certificate authority. Mount
  # the file, and give its path.
  # GIT_CA_BUNDLE: /etc/ssl/certs/git-host-ca.pem
