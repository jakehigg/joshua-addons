# Mirrors addons/developer/values.yaml: persistence, a mounted config file,
# extraEnv from the downward API, the two extra Service ports, and both
# optional blocks on: rbac (a ServiceAccount, a Role, and a RoleBinding) and
# networkPolicy (the worker and the manager policies). No other file in this
# directory renders rbac or networkPolicy.
image:
  repository: ghcr.io/jakehigg/joshua-addons-developer
persistence:
  enabled: true
  mountPath: /data
  size: 1Gi
configFile:
  enabled: true
  name: developer.yaml
  mountPath: /etc/joshua-addon/developer.yaml
  content: |
    network: off
    default_persona: opus
    max_workers: 2
    repos: []
    people: {}
env:
  DEVELOPER_DATA_DIR: /data
  DEVELOPER_CONFIG: /etc/joshua-addon/developer.yaml
  WORKER_RUNTIME: kubernetes
  WORKER_IMAGE: ghcr.io/jakehigg/joshua-addons-developer-worker:0.1.3
  MANAGER_HOST: addon-ci
extraEnv:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
service:
  extraPorts:
    - name: worker-api
      port: 8001
      targetPort: 8001
    - name: git-proxy
      port: 8002
      targetPort: 8002
rbac:
  enabled: true
networkPolicy:
  enabled: true
  workersInternetEgress: false
  gatewayNamespaces:
    - joshua
