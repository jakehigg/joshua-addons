{{- if or .Values.serviceAccount.create .Values.rbac.enabled }}
{{/* The identity of the addon pod. rbac.enabled binds its Role to it. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "joshua-addon.serviceAccountName" . }}
  labels:
    {{- include "joshua-addon.labels" . | nindent 4 }}
{{- end }}
