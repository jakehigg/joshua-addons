{{- if .Values.rbac.enabled }}
{{/* A Role in the release namespace only, and its binding to the release
     ServiceAccount. The addon gets rbac.rules in this namespace and no
     access to another namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "joshua-addon.fullname" . }}
  labels:
    {{- include "joshua-addon.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "joshua-addon.fullname" . }}
  labels:
    {{- include "joshua-addon.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "joshua-addon.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "joshua-addon.fullname" . }}
{{- end }}
