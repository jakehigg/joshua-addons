{{/* One addon, one container, one Deployment. `extraContainers` adds a
     sidecar an addon needs, such as a local cache; the chart renders it
     verbatim next to the main container. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joshua-addon.fullname" . }}
  labels:
    {{- include "joshua-addon.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  {{- /* A claim the chart makes is ReadWriteOnce, so the new pod cannot mount it
       while the old pod runs: a rolling update waits forever on a Multi-Attach
       error. Recreate stops the old pod first. An existing claim may be
       ReadWriteMany, so it keeps the Kubernetes default unless `strategy` says. */}}
  {{- $auto := and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  {{- $strategy := .Values.strategy | default (ternary "Recreate" "" $auto) }}
  {{- if $strategy }}
  strategy:
    type: {{ $strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "joshua-addon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "joshua-addon.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.configFile.enabled }}
      annotations:
        {{- if .Values.configFile.enabled }}
        # A changed config file changes this hash, so the pod restarts and reads it.
        checksum/config: {{ .Values.configFile.content | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with include "joshua-addon.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      # fsGroup makes a mounted volume group-writable for the app user. A
      # PersistentVolumeClaim mounts root-owned without it, and every addon
      # image runs as uid 1000, so an addon with persistence cannot write its
      # own data unless this is set.
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "joshua-addon.fullname" . }}
          image: {{ include "joshua-addon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- $workClaim := .Values.worker.workClaim }}
          {{- /* The named worker values, as the variables the addon reads. A
               named value wins over the same name in `env`, so the chart
               renders the name once. */}}
          {{- $worker := dict }}
          {{- with .Values.worker.image }}{{ $_ := set $worker "WORKER_IMAGE" . }}{{ end }}
          {{- with .Values.worker.imagePullSecret }}{{ $_ := set $worker "WORKER_IMAGE_PULL_SECRET" . }}{{ end }}
          {{- with .Values.worker.imagePullPolicy }}{{ $_ := set $worker "WORKER_IMAGE_PULL_POLICY" . }}{{ end }}
          {{- if or .Values.env .Values.extraEnv .Values.existingSecret .Values.envFrom $workClaim $worker }}
          env:
            {{- range $name, $value := .Values.env }}
            {{- if not (hasKey $worker $name) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if $worker }}
            # The worker image of an addon that starts workers: see `worker`.
            {{- end }}
            {{- range $name, $value := $worker }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $workClaim }}
            # The work storage of the workers: see worker.workClaim.
            - name: DEVELOPER_WORK_DIR
              value: {{ .Values.worker.workMountPath | quote }}
            - name: WORKER_WORK_CLAIM
              value: {{ $workClaim | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.envFrom .Values.existingSecret }}
          envFrom:
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port | default .Values.port }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port | default .Values.port }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.configFile.enabled $workClaim }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if $workClaim }}
            - name: work
              mountPath: {{ .Values.worker.workMountPath }}
            {{- end }}
            {{- if .Values.configFile.enabled }}
            - name: config
              mountPath: {{ .Values.configFile.mountPath }}
              subPath: {{ .Values.configFile.name }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.configFile.enabled $workClaim }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "joshua-addon.fullname" .) }}
        {{- end }}
        {{- if $workClaim }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ $workClaim }}
        {{- end }}
        {{- if .Values.configFile.enabled }}
        - name: config
          configMap:
            name: {{ include "joshua-addon.fullname" . }}
        {{- end }}
      {{- end }}
